kind: ServiceAccount
apiVersion: v1
metadata:
  namespace: restauranty
  name: account-restauranty-viewer-gxpft

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: restauranty
  name: role-restauranty-viewer-gxpft
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["chaos-mesh.org"]
  resources: [ "*" ]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-restauranty-viewer-gxpft
  namespace: restauranty
subjects:
- kind: ServiceAccount
  name: account-restauranty-viewer-gxpft
  namespace: restauranty
roleRef:
  kind: Role
  name: role-restauranty-viewer-gxpft
  apiGroup: rbac.authorization.k8s.io

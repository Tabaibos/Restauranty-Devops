apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.4
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        grafana:
          adminPassword: admingrafana
          defaultDashboardsEnabled: false
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              cert-manager.io/cluster-issuer: "cert-manager"
            hosts:
              - grafana-restauranty-quim.duckdns.org
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana-restauranty-quim.duckdns.org
          "grafana.ini":
            database:
              wal: true
          livenessProbe:
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          additionalDataSources:
            - name: Tempo
              type: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3100
              isDefault: false
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-loki-distributed-gateway.monitoring.svc.cluster.local
              isDefault: false
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: managed-csi
          resources:
            limits: { cpu: 1500m, memory: 1Gi }
            requests: { cpu: 200m, memory: 512Mi }
          sidecar:
            dashboards:
              resources:
                limits: { cpu: 100m, memory: 128Mi }
                requests: { cpu: 50m, memory: 64Mi }
            datasources:
              resources:
                limits: { cpu: 100m, memory: 128Mi }
                requests: { cpu: 50m, memory: 64Mi }
        kubeStateMetrics:
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
        nodeExporter:
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            retention: 15d
            resources:
              limits:
                cpu: 2000m
                memory: 4Gi
              requests:
                cpu: 500m
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
                  storageClassName: managed-csi
        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.1.0
    helm:
      valuesObject:
        driver:
          kind: modern_ebpf
        metrics:
          enabled: true
        serviceMonitor:
          create: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy: 
    syncOptions:
      - CreateNamespace=true
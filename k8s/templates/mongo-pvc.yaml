apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-mongo
spec:
  serviceName: my-mongo
  replicas: 1
  selector:
    matchLabels:
      app: my-mongo
  template:
    metadata:
      labels:
        app: my-mongo
    spec:
      containers:
        - name: my-mongo
          image: {{ .Values.mongo.image }}
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mongo.storage.className }}
        resources:
          requests:
            storage: {{ .Values.mongo.storage.size }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: restauranty-technical
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ops-support-dashboard.json: |
    {
      "title": "Restauranty — Technical View",
      "tags": ["restauranty", "ops", "aks"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "query": "label_values(kube_pod_info, namespace)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "pod",
            "type": "query",
            "query": "label_values(kube_pod_info, pod)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Pods running",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "count(kube_pod_status_phase{phase=\"Running\", namespace=~\"$namespace\"})" }]
        },
        {
          "id": 2,
          "title": "Free memory per pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "CPU per node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Free Disk per node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{fstype!=\"tmpfs\", mountpoint=\"/\"}",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Pods Restart",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "targets": [
            {
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$pod\"}[15m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Latency: Mongo queries (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 21 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le, service))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
        "id": 7,
        "title": "Falco - events by rule",
        "type": "timeseries",
        "gridPos": { "h": 8, "w": 24, "x": 0, "y": 29 },
        "targets": [{ "expr": "topk(5, sum by (rule_name) (rate(falcosecurity_falco_rules_matches_total[5m])))" }] 
        }
      ]
    }
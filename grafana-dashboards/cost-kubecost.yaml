apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecost-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubecost-dashboard.json: |
    {
      "title": "Restauranty — Costs (Kubecost)",
      "tags": ["restauranty", "finops", "kubecost"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Total cluster cost (por hora)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 3 } },
          "targets": [{ "expr": "sum(node_total_hourly_cost)", "legendFormat": "custo/h" }]
        },
        {
          "id": 2,
          "title": "Estimated monthly cost (projection)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } },
          "targets": [{ "expr": "sum(node_total_hourly_cost) * 730", "legendFormat": "projeção/mês" }]
        },
        {
          "id": 3,
          "title": "PVC cost (per hour)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 4 } },
          "targets": [{ "expr": "sum(pv_hourly_cost)", "legendFormat": "PVs/h" }]
        },
        {
          "id": 4,
          "title": "Active Nodes",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{ "expr": "count(node_total_hourly_cost)", "legendFormat": "nós" }]
        },
        {
          "id": 5,
          "title": "Cost per hour per node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD" } },
          "targets": [
            {
              "expr": "node_total_hourly_cost",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Cost by node (CPU vs RAM)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD" } },
          "targets": [
            { "expr": "sum(node_cpu_hourly_cost)", "legendFormat": "CPU" },
            { "expr": "sum(node_ram_hourly_cost)", "legendFormat": "RAM" }
          ]
        },
        {
          "id": 7,
          "title": "CPU used by namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum by (namespace) (container_cpu_allocation)",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "Memory used by namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_allocation_bytes)",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "CPU used by service (restauranty)",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum by (pod) (container_cpu_allocation{namespace=\"restauranty\"})",
              "legendFormat": "{{pod}}",
              "instant": true
            }
          ]
        },
        {
          "id": 10,
          "title": "Instant cost by node",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "targets": [
            {
              "expr": "node_total_hourly_cost",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true, "job": true, "instance": true },
                "renameByName": { "node": "Nó", "Value": "Custo/h (USD)" }
              }
            }
          ]
        }
      ]
    }